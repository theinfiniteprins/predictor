# Single source of truth for Phase 0 parameters, SHARED across every instrument.
# Phase 6 sweeps (k, confidence threshold, embargo) are edits to THIS file, not code.
#
# Per-instrument settings (which stock, its ticker, its benchmark) now live in
# instruments.yaml at the repo root - selected via the PREDICTOR_INSTRUMENT env var
# (or --instrument on the CLI scripts), not here.

session:                        # IST, NSE equity/index segment
  timezone: "Asia/Kolkata"
  open: "09:15"
  close: "15:30"

labeling:
  k: 1.0                        # barrier multiplier, symmetric
  atr_window: 14                # sessions, for sigma_intraday = ATR(atr_window) / close
  vertical_barrier: "15:20"     # timeout label = 0
  entry_start: "09:30"          # first rolling entry point
  entry_end: "14:30"            # last rolling entry point
  entry_freq_minutes: 15
  intrabar_tiebreak: "one_minute"  # one_minute | drop
  barriers_symmetric: true
  # ATR(14) measures a whole SESSION's range. A mid-session entry has less time
  # left, so scale the barrier by sqrt(minutes_to_vertical / session_minutes).
  # false -> barriers held at full daily sigma (very few touches; ~97% timeout).
  barrier_time_scaling: true
  session_minutes: 375             # 09:15 -> 15:30, the "1 daily sigma" horizon

data:
  bar_interval: "5m"            # Track A primary interval
  fine_interval: "1m"           # for intrabar tie-break (only ~7d available from yfinance)
  backfill_period: "60d"        # yfinance max at 5m
  daily_period: "10y"           # yfinance daily bars, for ATR + long context

global_cues:                    # all free via yfinance; prior-session close used as feature
  sp500: "^GSPC"
  nasdaq: "^IXIC"
  usdinr: "INR=X"
  crude: "CL=F"
  india_vix: "^INDIAVIX"        # daily history (the live snapshots only start from today)
  gift_nifty: ""                # no reliable free ticker; left blank, handled as optional

collector:                      # Track B
  poll_seconds: 90
  source: "yfinance"            # yfinance fast_info / 1m history
  # collector only writes between session.open and session.close on trading days

cv:                             # Phase 4 — purged + embargoed walk-forward
  embargo_minutes: 60
  min_train_days: 20
  test_window_days: 5
  step_days: 5

meta:                           # Phase 5
  fire_top_fraction: 0.15       # act only on top 15% highest-confidence calls

  # Evidence gate (Phase 5b). fire_top_fraction alone is a RELATIVE cutoff, so the
  # top 15% always fires no matter how bad the calls are. With require_proven_edge on,
  # a threshold is only saved if the out-of-fold record beats the naive "always name
  # the majority direction" baseline, measured with a day-block bootstrap (rolling
  # entries overlap, so row-wise intervals are ~2-3x too narrow - see
  # validation/significance.py). No proven edge -> fire_threshold is null -> the model
  # stays silent. Silence is the correct output when there is nothing to say.
  require_proven_edge: true
  min_fire_trades: 30           # fewest OOF calls before an edge is even testable
  min_fire_days: 15             # ...spread over at least this many distinct sessions
  bootstrap_samples: 2000
  significance_alpha: 0.05

  # Two more guards, because the gate is re-run on every nightly retrain and a test
  # repeated ~250 times a year passes by luck sooner or later:
  #   confirm_days        - most recent sessions held out of threshold SELECTION; the
  #                         chosen cutoff must also show a positive margin there.
  #   min_consecutive_passes - how many retrains in a row must pass before a threshold
  #                         is actually saved. Counter lives in the model card.
  confirm_days: 20
  min_consecutive_passes: 3

paths:
  data_dir: "data"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"
