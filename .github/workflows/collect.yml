name: collect

# Cloud Track-B collector. Polls ^NSEI + ^NSEBANK every ~5 min during NSE market
# hours and commits one parquet/day under collected/. Runs regardless of whether
# the laptop is on. NSE-direct data (option chain / PCR / FII-DII) is NOT collected
# here — datacenter IPs are blocked; that stays a laptop catch-up job.

on:
  schedule:
    # GitHub cron is UTC. NSE 09:15–15:30 IST == 03:45–10:00 UTC. Wide margin;
    # the script itself no-ops outside market hours and on holidays.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install deps
        run: |
          pip install -r requirements-collector.txt
          pip install -e . --no-deps

      - name: Poll
        env:
          PREDICTOR_LIVE_ROOT: collected
        run: python scripts/collect_tick.py

      - name: Commit new ticks
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add collected
          if git diff --cached --quiet; then
            echo "no new data this run"
            exit 0
          fi
          git commit -m "data: tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push collected data after 5 attempts"
          exit 1
